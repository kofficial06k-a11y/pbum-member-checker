<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PBUM Membership Checker</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        sans-serif;

      background: #f6f5f1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 450px;

      background: white;

      padding: 35px;

      border-radius: 20px;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;

      font-size: 22px;

      font-weight: bold;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #777;

      margin-bottom: 30px;
    }

    label {
      display: block;

      margin-top: 18px;
      margin-bottom: 7px;

      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #888;
    }

    button {
      width: 100%;

      margin-top: 25px;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 25px;
    }

    .success,
    .error {
      padding: 18px;

      border-radius: 12px;
    }

    .success {
      background: #eef8f0;
    }

    .error {
      background: #fff0f0;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="logo">
      PBUM Membership Checker
    </div>

    <div class="subtitle">
      Verify your membership status
    </div>


    <label for="memberId">
      Membership ID
    </label>

    <input
      id="memberId"
      type="text"
      placeholder="e.g. PBUM-000001"
    >


    <label for="studentId">
      Student ID
    </label>

    <input
      id="studentId"
      type="text"
      placeholder="e.g. 23012345"
    >


    <button onclick="checkMembership()">
      Check Membership
    </button>


    <div id="result"></div>

  </div>


  <script>

    async function checkMembership() {

      const memberId =
        document
          .getElementById("memberId")
          .value
          .trim();

      const studentId =
        document
          .getElementById("studentId")
          .value
          .trim();


      if (!memberId || !studentId) {

        document.getElementById("result").innerHTML =

          '<div class="error">' +
          'Please enter both Membership ID and Student ID.' +
          '</div>';

        return;
      }


      document.getElementById("result").innerHTML =
        "Checking...";


  try {
  const response = await fetch(
    `/api/check?memberId=${encodeURIComponent(memberId)}&studentId=${encodeURIComponent(studentId)}`
  );

  const data = await response.json();

  if (data.found) {
    document.getElementById("result").innerHTML =
      '<div class="success">' +
      '<strong>Membership Verified ✓</strong><br><br>' +
      'Membership ID: ' +
      data.memberId +
      '<br>' +
      'Membership Year: ' +
      data.membershipYear +
      '<br>' +
      'Status: ' +
      data.status +
      '</div>';
  } else {
    document.getElementById("result").innerHTML =
      '<div class="error">' +
      '<strong>Membership Not Found</strong><br><br>' +
      'Please check your Membership ID and Student ID.' +
      '</div>';
  }

} catch (error) {
  console.error(error);

  document.getElementById("result").innerHTML =
    '<div class="error">' +
    '<strong>Something went wrong.</strong><br><br>' +
    'Please try again later.' +
    '</div>';
}

    }

  </script>

</body>

</html>
